name: Coordinación

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  issues:
    types: [labeled, closed, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: coordinacion-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  comentario:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login == github.event.comment.user.login &&
      (
        github.event.comment.body == '/tomar' ||
        github.event.comment.body == '/liberar-forzado' ||
        github.event.comment.body == '/adoptar-contrato-huerfana' ||
        startsWith(github.event.comment.body, '/liberar ') ||
        startsWith(github.event.comment.body, '/transferir ') ||
        startsWith(github.event.comment.body, '/migrar-contrato ') ||
        startsWith(github.event.comment.body, '/renovar-contrato ') ||
        contains(github.event.comment.body, '/tomar') ||
        contains(github.event.comment.body, '/liberar-forzado') ||
        contains(github.event.comment.body, '/adoptar-contrato-huerfana') ||
        contains(github.event.comment.body, '/liberar ') ||
        contains(github.event.comment.body, '/transferir ') ||
        contains(github.event.comment.body, '/migrar-contrato ') ||
        contains(github.event.comment.body, '/renovar-contrato ')
      )
    # El reusable mantiene el envelope compatible con callers v1.0.18;
    # la evidencia workflow_success del sweep usa lectura pública acotada.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: comment
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.comment.user.login }}
      association: ${{ github.event.comment.author_association }}
      body: ${{ github.event.comment.body }}

      profile: es
  etiqueta:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'estado: reservado'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: label
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.sender.login }}
      label: ${{ github.event.label.name }}

      profile: es
  pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # La operación pr conserva el envelope histórico de v1.0.18 y el
    # reusable sigue estrechando permisos dentro de Factory.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: pr
      pr_number: ${{ github.event.pull_request.number }}
      action: ${{ github.event.action }}

      profile: es
  validar-pr-evento:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: 'true'

  validar-pr:
    if: >-
      github.event_name == 'pull_request' &&
      !(
        startsWith(github.event.pull_request.head.ref, 'factory/bootstrap-coordination-') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.author_association == 'OWNER'
      )
    # El job validar-pr conserva permisos internos read-only sin exigir
    # scopes nuevos al caller histórico.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    needs: validar-pr-evento
    with:
      operation: validate
      pr_number: ${{ github.event.pull_request.number }}
      require_reservation: true

      profile: es
  issue:
    if: github.event_name == 'issues' && (github.event.action == 'closed' || github.event.action == 'reopened')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: issue
      issue_number: ${{ github.event.issue.number }}
      action: ${{ github.event.action }}

      profile: es
  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: sweep
      profile: es
